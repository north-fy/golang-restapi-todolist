version: '3'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOST_SERVER: 0.0.0.0
      PORT_SERVER: 8080
      TIMEOUT_SERVER: 60s

      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DBNAME: restapi_todo
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: admin
      REDIS_PASSWORD: admin
      REDIS_DB: 0
      REDIS_TTL: 60s

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DBNAME}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "5432:5432"
    volumes:
      - postgresV:/var/lib/postgresql/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USERNAME}", "-d", "${POSTGRES_DB}"]
      retries: 3
      interval: 5s

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DBNAME}?sslmode=disable
      - up

  redis:
    image: redis:alpine
    command: redis-server --requirepass 1111 --appendonly yes --aclfile /usr/local/etc/redis/users.acl
    ports:
      - "6379:6379"
    volumes:
      - redisV:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      interval: 5s

volumes:
  postgresV:

  redisV:
